name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.12', '3.13']
        exclude:
          # setup-python has no 3.8 for the current ubuntu-latest image.
          - os: ubuntu-latest
            python: '3.8'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Same invocation as pysmt's installer, so a green build here means
      # pysmt can build it too. Tests run from outside the source tree.
      - name: Build into a bindings dir
        shell: bash
        run: python -m pip install --no-deps --target "$RUNNER_TEMP/bindings" .

      - name: Test relocated bindings
        shell: bash
        env:
          # Forces glibc to mmap every allocation, so CUDD nodes live above
          # 4 GB and a pointer truncated to 32 bits crashes the smoke test.
          # Windows heaps are already there.
          MALLOC_MMAP_THRESHOLD_: '0'
          PYTHONPATH: ${{ runner.temp }}/bindings
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/test_smoke.py"
          python "$GITHUB_WORKSPACE/examples/example1.py"
          python "$GITHUB_WORKSPACE/examples/example2.py"
